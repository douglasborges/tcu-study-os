<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800"><rect width="1400" height="800" fill="#0b0d0a"/><path d="M390 600h620" stroke="#2a3025" stroke-width="16" stroke-linecap="round"/><circle cx="500" cy="600" r="26" fill="#53653b"/><circle cx="700" cy="600" r="34" fill="#7ba13f"/><circle cx="900" cy="600" r="44" fill="#c5f65b"/><text x="700" y="265" fill="#c5f65b" font-family="Arial,Helvetica,sans-serif" font-size="76" text-anchor="middle" font-weight="800">Um passo de cada vez.</text><text x="700" y="395" fill="#eef2e8" font-family="Arial,Helvetica,sans-serif" font-size="42" text-anchor="middle">Você não precisa vencer tudo hoje.</text><text x="700" y="465" fill="#eef2e8" font-family="Arial,Helvetica,sans-serif" font-size="42" text-anchor="middle">Precisa cumprir o próximo passo</text><text x="700" y="525" fill="#bdc8b3" font-family="Arial,Helvetica,sans-serif" font-size="38" text-anchor="middle">— e continuar amanhã.</text></svg>