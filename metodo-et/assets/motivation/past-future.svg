<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800"><rect width="1400" height="800" fill="#0b0d0a"/><rect x="70" y="70" width="1260" height="660" rx="36" fill="#151b12" stroke="#526b36" stroke-width="3"/><text x="700" y="300" fill="#eef2e8" font-family="Arial,Helvetica,sans-serif" font-size="68" text-anchor="middle" font-weight="700">Seu passado até aqui</text><text x="700" y="390" fill="#c5f65b" font-family="Arial,Helvetica,sans-serif" font-size="76" text-anchor="middle" font-weight="800">não define o seu futuro.</text><text x="700" y="520" fill="#bdc8b3" font-family="Arial,Helvetica,sans-serif" font-size="38" text-anchor="middle">O que você escolher fazer a partir de agora</text><text x="700" y="575" fill="#eef2e8" font-family="Arial,Helvetica,sans-serif" font-size="38" text-anchor="middle" font-weight="700">pode definir o seu futuro.</text></svg>