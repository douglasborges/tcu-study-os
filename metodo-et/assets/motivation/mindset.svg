<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800"><rect width="1400" height="800" fill="#0b0d0a"/><path d="M180 640V180h14v460zm1020 0V180h14v460z" fill="#2a3025"/><text x="700" y="250" fill="#c5f65b" font-family="Arial,Helvetica,sans-serif" font-size="52" text-anchor="middle" font-weight="800">MENTALIDADE DO 01</text><text x="700" y="365" fill="#eef2e8" font-family="Arial,Helvetica,sans-serif" font-size="64" text-anchor="middle" font-weight="750">Estude para ser o primeiro lugar,</text><text x="700" y="445" fill="#eef2e8" font-family="Arial,Helvetica,sans-serif" font-size="64" text-anchor="middle" font-weight="750">não apenas para passar.</text><text x="700" y="565" fill="#a5af9a" font-family="Arial,Helvetica,sans-serif" font-size="36" text-anchor="middle">Sua mente calibra o esforço de acordo com seu pensamento.</text></svg>