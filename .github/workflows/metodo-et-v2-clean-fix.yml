name: Metodo ET v2.3 validacao historico

on:
  push:
    paths:
      - '.github/workflows/metodo-et-v2-clean-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v2.3 imported-history validation
        shell: python
        run: |
          from pathlib import Path

          root = Path('metodo-et')
          app_path = root / 'src/app.js'
          core_path = root / 'src/core.js'
          index_path = root / 'index.html'

          app = app_path.read_text(encoding='utf-8')
          core = core_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')

          # 1) Histórico importado pode validar a teoria sem exigir baterias antigas.
          # Unidades sem evidência continuam usando a sequência rígida normal do Método ET.
          old = "if(theory&&!u.theoryDone)requirePrevious(s,u);"
          new = "if(theory&&!u.theoryDone&&!u.legacy.some(e=>e.status!=='Em espera'||e.date))requirePrevious(s,u);"
          if old in core:
              core = core.replace(old, new, 1)
          if new not in core:
              raise SystemExit('Não foi possível aplicar a exceção segura para histórico importado.')
          core_path.write_text(core, encoding='utf-8')

          # 2) Sugerir automaticamente a última data real encontrada nas evidências importadas.
          helper_anchor = "function refreshSessionContent(){let form=$('#session-form');if(!form)return;let s=subject(form.elements.subjectId.value),u=s?.units.find(u=>u.id===form.elements.unitId.value),wrap=$('#session-content-wrap');if(wrap)wrap.innerHTML=sessionContentField(s,u,'');}\n"
          helper = "function suggestedTheoryDate(u){let dates=(u?.legacy||[]).map(e=>e.date).filter(d=>/^\\d{4}-\\d{2}-\\d{2}$/.test(d||'')).sort();return dates.at(-1)||'';}\n"
          if 'function suggestedTheoryDate(' not in app:
              if helper_anchor not in app:
                  raise SystemExit('Âncora para suggestedTheoryDate não encontrada.')
              app = app.replace(helper_anchor, helper_anchor + helper, 1)

          # 3) Pré-preencher a data da teoria com a evidência importada e explicar o comportamento.
          app = app.replace('value="${u.theoryDate}"', 'value="${u.theoryDate||suggestedTheoryDate(u)}"', 1)
          old_label = "Teoria concluída para toda esta ${s.id==='afo'?'unidade (módulo completo)':'aula'}</label>"
          new_label = "Teoria concluída para toda esta ${s.id==='afo'?'unidade (módulo completo)':'aula'}</label>${u.legacy.length&&!u.theoryDone?'<small>Histórico StudyOS encontrado: você pode confirmar a teoria na data real sem marcar bateria ou checkpoint.</small>':''}"
          if old_label in app:
              app = app.replace(old_label, new_label, 1)

          # 4) Cache bust da nova build.
          app = app.replace("./core.js?v=2.2", "./core.js?v=2.3", 1)
          app_path.write_text(app, encoding='utf-8')
          index = index.replace('?v=2.2', '?v=2.3')
          index = index.replace('content="2.2-registration"', 'content="2.3-legacy-validation"')
          index_path.write_text(index, encoding='utf-8')

          # 5) Asserções de segurança: preservar a estabilidade do Dock/Dados e a nova regra.
          app = app_path.read_text(encoding='utf-8')
          core = core_path.read_text(encoding='utf-8')
          index = index_path.read_text(encoding='utf-8')
          drive = (root / 'drive-sync.js').read_text(encoding='utf-8')
          assert new in core
          assert 'function suggestedTheoryDate(' in app
          assert "./core.js?v=2.3" in app
          assert '2.3-legacy-validation' in index
          assert '?v=2.3' in index
          assert 'MutationObserver' not in drive
          assert 'main.focus()' not in app

      - name: Syntax check
        run: |
          cp metodo-et/src/app.js /tmp/metodo-et-app.mjs
          cp metodo-et/src/core.js /tmp/metodo-et-core.mjs
          node --check /tmp/metodo-et-app.mjs
          node --check /tmp/metodo-et-core.mjs

      - name: Commit v2.3
        run: |
          git config user.name 'Metodo ET Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add metodo-et
          git commit -m 'fix: Método ET v2.3 — validar teoria importada sem inventar baterias' || exit 0
          git push
