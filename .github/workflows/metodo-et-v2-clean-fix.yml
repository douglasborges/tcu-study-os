name: Metodo ET v2.5 editar excluir legislacao

on:
  push:
    paths:
      - '.github/workflows/metodo-et-v2-clean-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar edição/exclusão da Legislação Seca v2.5
        run: python scripts/apply_metodo_et_v25_law_edit_delete.py
      - name: Validar sintaxe JavaScript
        run: |
          cp metodo-et/src/app.js /tmp/metodo-et-app.mjs
          cp metodo-et/src/core.js /tmp/metodo-et-core.mjs
          cp metodo-et/src/personal.js /tmp/metodo-et-personal.mjs
          node --check /tmp/metodo-et-app.mjs
          node --check /tmp/metodo-et-core.mjs
          node --check /tmp/metodo-et-personal.mjs
      - name: Publicar v2.5
        run: |
          git config user.name 'Metodo ET Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add metodo-et
          git commit -m 'feat: Método ET v2.5 — editar e excluir registros de legislação' || exit 0
          git push
