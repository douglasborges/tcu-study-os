name: Metodo ET v2.1 clean fix

on:
  push:
    paths:
      - '.github/workflows/metodo-et-v2-clean-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v2.1 clean fix
        shell: python
        run: |
          from pathlib import Path
          import base64, json

          root = Path('metodo-et')

          # 1) Ícone final: exatamente a arte fornecida pelo usuário, preparada em PNG 128x128.
          icon_b64 = (root / 'icon-user-final.b64').read_text(encoding='utf-8').strip()
          icon_bytes = base64.b64decode(icon_b64, validate=True)
          (root / 'metodo-et-icon-final-v2.png').write_bytes(icon_bytes)
          (root / 'icon-user-final.b64').unlink()

          # 2) Navegação: remove o foco forçado do hashchange.
          app_path = root / 'src/app.js'
          app = app_path.read_text(encoding='utf-8')
          old = "window.addEventListener('hashchange',()=>{render();main.focus();});"
          new = "window.addEventListener('hashchange',()=>{render();});"
          if old not in app and new not in app:
              raise SystemExit('Não encontrei o handler de hashchange esperado.')
          app = app.replace(old, new)
          app_path.write_text(app, encoding='utf-8')

          # 3) Dados: texto estático coerente; o Drive não toca mais no DOM da página.
          old_warning = 'O Drive não é sincronizado automaticamente nesta versão. O backup consultado foi atualizado em 09/09/2026.'
          new_warning = 'A sincronização com o Google Drive é controlada pelo botão de nuvem. Seus dados também permanecem salvos localmente neste dispositivo.'
          app = app_path.read_text(encoding='utf-8').replace(old_warning, new_warning)
          app_path.write_text(app, encoding='utf-8')

          # 4) HTML v2.1: apenas app + OAuth + drive-sync estável. Sem SW/hotfixes concorrentes.
          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('?v=2.0', '?v=2.1')
          index = index.replace('./apple-touch-icon-final.png?v=2.1', './metodo-et-icon-final-v2.png?v=2.1')
          index = index.replace('./apple-touch-icon-final.png', './metodo-et-icon-final-v2.png')
          if 'navigation-dock-hotfix' in index or 'data-page-stability-hotfix' in index:
              raise SystemExit('Index ainda contém hotfixes antigos.')
          if './drive-sync.js?v=2.1' not in index:
              raise SystemExit('Index não aponta para drive-sync.js v2.1.')
          index = index.replace('<title>Método ET · Preparação TCU</title>', '<title>Método ET · Preparação TCU</title>\n  <meta name="metodo-et-build" content="2.1-clean">')
          index_path.write_text(index, encoding='utf-8')

          # 5) Manifesto: novo ícone e versão limpa.
          manifest_path = root / 'manifest.webmanifest'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['start_url'] = './'
          manifest['icons'] = [
              {'src':'./metodo-et-icon-final-v2.png','sizes':'128x128','type':'image/png','purpose':'any'},
              {'src':'./metodo-et-icon-final-v2.png','sizes':'128x128','type':'image/png','purpose':'maskable'}
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # 6) Asserções de produção: nenhum observer/hotfix ativo e nenhuma chamada main.focus na navegação.
          drive = (root / 'drive-sync.js').read_text(encoding='utf-8')
          app = app_path.read_text(encoding='utf-8')
          final_index = index_path.read_text(encoding='utf-8')
          assert 'MutationObserver' not in drive
          assert 'updateDataPageCopy' not in drive
          assert 'main.focus()' not in app
          assert 'navigation-dock-hotfix' not in final_index
          assert 'data-page-stability-hotfix' not in final_index
          assert 'drive-sync-v1.2' not in final_index
          assert 'metodo-et-icon-final-v2.png' in final_index
          assert 'metodo-et-build" content="2.1-clean' in final_index

      - name: Commit v2.1
        run: |
          git config user.name 'Metodo ET Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add metodo-et
          git commit -m 'fix: Método ET v2.1 limpa — Dados, Dock e ícone final' || exit 0
          git push
