name: Metodo ET v2 clean fix

on:
  push:
    paths:
      - '.github/workflows/metodo-et-v2-clean-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply clean Dock/Data fix and final icon
        shell: python
        run: |
          from pathlib import Path
          import re, base64

          root = Path('metodo-et')

          # 1) Drive v1.3: remove ALL DOM mutation watching from the sync engine.
          old = root / 'drive-sync-v1.2.js'
          src = old.read_text(encoding='utf-8')
          before = src
          src = src.replace("    renderButton();\n    updateDataPageCopy();", "    renderButton();")
          src, n1 = re.subn(
              r"\n  function updateDataPageCopy\(\) \{.*?\n  \}\n\n  function loadGoogleIdentity",
              "\n\n  function loadGoogleIdentity",
              src,
              count=1,
              flags=re.S,
          )
          src, n2 = re.subn(
              r"\n    startRemoteTimer\(\);\n    const observer = new MutationObserver\(updateDataPageCopy\);\n    const main = document\.querySelector\('#main'\);\n    if \(main\) observer\.observe\(main, \{ childList: true, subtree: true \}\);\n    window\.addEventListener\('hashchange', \(\) => queueMicrotask\(updateDataPageCopy\)\);\n",
              "\n    startRemoteTimer();\n",
              src,
              count=1,
              flags=re.S,
          )
          if n1 != 1 or n2 != 1 or src == before:
              raise SystemExit(f'Unexpected drive-sync source: update function={n1}, observer={n2}')
          if 'MutationObserver' in src or 'updateDataPageCopy' in src:
              raise SystemExit('Drive sync still contains Data-page mutation code')
          src = src.replace('[Metodo ET Drive Sync v1.2]', '[Metodo ET Drive Sync v1.3]')
          (root / 'drive-sync-v1.3.js').write_text(src, encoding='utf-8')

          # 2) Revert navigation to the app's native hash routing; no competing hotfixes.
          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('?v=1.9', '?v=2.0')
          index = re.sub(r'\n\s*<script src="\./navigation-dock-hotfix\.js\?v=2\.0" defer></script>', '', index)
          index = re.sub(r'\n\s*<script src="\./data-page-stability-hotfix\.js\?v=2\.0" defer></script>', '', index)
          index = index.replace('./drive-sync-v1.2.js?v=2.0', './drive-sync-v1.3.js?v=2.0')
          index = index.replace('./apple-touch-icon-final.png', './metodo-et-icon-v2.png')
          index_path.write_text(index, encoding='utf-8')

          # 3) Final icon: generated directly from the user-supplied green alien icon.
          icon_b64 = '''[... truncated for display ...]IEND''' 
          (root / 'metodo-et-icon-v2.png').write_bytes(base64.b64decode(icon_b64))

          # 4) Manifest points only to the new icon path.
          manifest_path = root / 'manifest.webmanifest'
          manifest = manifest_path.read_text(encoding='utf-8')
          manifest = manifest.replace('./apple-touch-icon-final.png', './metodo-et-icon-v2.png')
          manifest_path.write_text(manifest, encoding='utf-8')

          # 5) Service worker: hard cache break and only stable scripts.
          sw_path = root / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE_NAME = `\$\{CACHE_PREFIX\}v[^`]+`;", "const CACHE_NAME = `${CACHE_PREFIX}v2-0`;", sw)
          sw = sw.replace("  './navigation-dock-hotfix.js',\n", '')
          sw = sw.replace("  './data-page-stability-hotfix.js',\n", '')
          sw = sw.replace("  './drive-sync-v1.2.js',", "  './drive-sync-v1.3.js',")
          sw = sw.replace("  './apple-touch-icon-final.png',", "  './metodo-et-icon-v2.png',")
          sw_path.write_text(sw, encoding='utf-8')

          # Static assertions: no mutation observer in the active Drive engine and no competing hotfixes.
          assert 'MutationObserver' not in (root / 'drive-sync-v1.3.js').read_text(encoding='utf-8')
          final_index = index_path.read_text(encoding='utf-8')
          assert 'data-page-stability-hotfix' not in final_index
          assert 'navigation-dock-hotfix' not in final_index
          assert 'drive-sync-v1.3.js?v=2.0' in final_index
          assert 'metodo-et-icon-v2.png' in final_index

      - name: Commit fixed production files
        run: |
          git config user.name 'Metodo ET Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add metodo-et
          git commit -m 'fix: Método ET v2.0 sem travamento em Dados' || exit 0
          git push
