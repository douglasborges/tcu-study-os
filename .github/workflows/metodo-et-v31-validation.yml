name: Metodo ET Camile local validation

on:
  push:
    branches: [estudos-camile]
    paths:
      - 'metodo-et/**'
      - '.github/workflows/metodo-et-v31-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar JavaScript
        run: |
          cp metodo-et/src/app.js /tmp/app.mjs
          cp metodo-et/src/achievements.js /tmp/achievements.mjs
          cp metodo-et/src/core.js /tmp/core.mjs
          cp metodo-et/src/personal.js /tmp/personal.mjs
          cp metodo-et/src/progress.js /tmp/progress.mjs
          cp metodo-et/src/analytics.js /tmp/analytics.mjs
          node --check /tmp/app.mjs
          node --check /tmp/achievements.mjs
          node --check /tmp/core.mjs
          node --check /tmp/personal.mjs
          node --check /tmp/progress.mjs
          node --check /tmp/analytics.mjs
          node --check metodo-et/drive-sync.js
          node --check metodo-et/drive-sync-ui.js

      - name: Validar base zerada da Camile
        run: |
          cp metodo-et/src/core.js /tmp/core.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {validate,CYCLE,KEY,methodUnits} from '/tmp/core.mjs';
          const st=JSON.parse(fs.readFileSync('metodo-et/data/initial-state.json','utf8'));
          validate(st);
          if(KEY!=='metodo-et:camile:v1') throw new Error('Chave local da Camile incorreta.');
          if(JSON.stringify(CYCLE)!==JSON.stringify(['port','dcon','info'])) throw new Error('Ciclo inicial incorreto.');
          if(st.sessions.length||st.imports.length||st.archive.length||st.achievementsSeen.length) throw new Error('A base precisa nascer zerada.');
          const ids=st.subjects.map(s=>s.id);
          if(!['afo','dad','ti','port','dcon','info'].every(id=>ids.includes(id))) throw new Error('Disciplinas-base não preservadas.');
          const info=st.subjects.find(s=>s.id==='info'),route=methodUnits(info);
          const first=route.slice(0,9).map(u=>u.title);
          const expected=['INFO01 - Windows 11','INFO03 - Word','INFO04 - Excel','INFO05 - PowerPoint','INFO07 - Correio Eletrônico','INFO08 - Navegadores','INFO09 - Busca, grupos, redes sociais','INF10 - Hardware e Software','INF11 - Microsoft Teams'];
          if(JSON.stringify(first)!==JSON.stringify(expected)) throw new Error('Ordem inicial de Informática inválida.');
          if(route[9]?.track!=='dados') throw new Error('Dados deve entrar logo após Informática ativa.');
          const later=route.filter(u=>u.deferred).map(u=>u.title);
          if(JSON.stringify(later)!==JSON.stringify(['INFO01 - Windows 10','INFO02 - Linux','INFO06 - LibreOffice'])) throw new Error('Conteúdos adiados incorretos.');
          console.log('Base Camile OK');
          NODE

      - name: Validar identidade e Drive isolado
        run: |
          grep -q 'MISSÃO CGU' metodo-et/index.html
          grep -q 'camile-brand.svg' metodo-et/index.html
          grep -q 'camile-capybara.svg' metodo-et/styles.css
          grep -q "metodo-et:camile:v1" metodo-et/drive-sync.js
          grep -q "Metodo ET - Camile - Dados.json" metodo-et/drive-sync.js
          grep -q "const ACTIVE=\['port','dcon','info','afo','dad','ti'\]" metodo-et/src/analytics.js
