name: Metodo ET v4.1.5 stable validation

on:
  push:
    paths:
      - 'metodo-et/**'
      - '.github/workflows/metodo-et-v31-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript
        run: |
          cp metodo-et/src/app.js /tmp/app.mjs
          cp metodo-et/src/achievements.js /tmp/achievements.mjs
          cp metodo-et/src/core.js /tmp/core.mjs
          cp metodo-et/src/personal.js /tmp/personal.mjs
          cp metodo-et/src/progress.js /tmp/progress.mjs
          cp metodo-et/src/analytics.js /tmp/analytics.mjs
          node --check /tmp/app.mjs
          node --check /tmp/achievements.mjs
          node --check /tmp/core.mjs
          node --check /tmp/personal.mjs
          node --check /tmp/progress.mjs
          node --check /tmp/analytics.mjs
          node --check metodo-et/drive-sync.js
          node --check metodo-et/drive-sync-ui.js
      - name: Executar motor analítico v4.1.5
        run: |
          cp metodo-et/src/core.js /tmp/core.mjs
          sed "s#'./core.js?v=4.1.5'#'./core.mjs'#" metodo-et/src/analytics.js > /tmp/analytics-runtime.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {analyticsSnapshot} from '/tmp/analytics-runtime.mjs';
          const state=JSON.parse(fs.readFileSync('metodo-et/data/initial-state.json','utf8'));
          const snap=analyticsSnapshot(state,{today:'2026-09-18'});
          if(!Array.isArray(snap.subjects)||snap.subjects.length!==5) throw new Error('Central deve calcular cinco disciplinas.');
          if(!Array.isArray(snap.weekly)||snap.weekly.length!==8) throw new Error('Série semanal inválida.');
          if(!Array.isArray(snap.monthly)||snap.monthly.length!==6) throw new Error('Série mensal inválida.');
          if(!snap.todayStats||!snap.yesterdayStats) throw new Error('Comparação hoje x ontem indisponível.');
          console.log('Analytics OK:',snap.subjects.length,'disciplinas,',snap.weekly.length,'semanas.');
          NODE
      - name: Validar ciclo por ocorrência e Metas ET
        run: |
          cp metodo-et/src/core.js /tmp/core.mjs
          sed "s#'./core.js'#'./core.mjs'#" metodo-et/src/personal.js > /tmp/personal-runtime.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {day,session} from '/tmp/core.mjs';
          import {goalSnapshot,GOAL_TEMPLATES} from '/tmp/personal-runtime.mjs';
          const base=JSON.parse(fs.readFileSync('metodo-et/data/initial-state.json','utf8'));
          const advanced=session(base,{subjectId:'afo',date:day(),activity:'free',minutes:37,questions:0,correct:0,applyCycle:true});
          if(advanced.cycle.index!==1||!advanced.sessions.at(-1).slotComplete) throw new Error('Ocorrência de 37 min deveria concluir e chamar DAD.');
          const partial=session(base,{subjectId:'afo',date:day(),activity:'micro',minutes:30,questions:0,correct:0,applyCycle:false});
          if(partial.cycle.index!==0||partial.sessions.at(-1).slotComplete) throw new Error('Sessão parcial não pode avançar o ciclo.');
          const goal=goalSnapshot(base);
          if(goal.targetMinutes!==1800||GOAL_TEMPLATES[0].tasks.length!==18||goal.status!=='active') throw new Error('Meta 01 inválida.');
          console.log('Ciclo livre OK · Meta 01:',GOAL_TEMPLATES[0].tasks.length,'etapas.');
          NODE
      - name: Validar trilha estratégica de TI
        run: |
          cp metodo-et/src/core.js /tmp/core.mjs
          node --input-type=module - <<'NODE'
          import {methodUnits,methodOrder,setUnit} from '/tmp/core.mjs';
          const unit=(id,order,title)=>({id,order,title,theoryDone:false,theoryDate:'',batteryDone:false,generalDone:false,materialReady:false,battery:{attempted:0,correct:0},general:{attempted:0,correct:0},legacy:[],marks:[]});
          const ti={id:'ti',phase:'new',slotMinutes:90,checkpoints:{},notebooks:[],andresanComplete:false,units:[
            unit('ti-u-1',1,'FD00 - Introdução à Fluência em Dados'),
            unit('ti-u-2',2,'FD01 - Fundamentos de Dados'),
            unit('ti-u-3',3,'FD02 - Fundamentos de Bancos de Dados'),
            unit('ti-u-10',10,'TI01 - Parte I - Bancos de Dados - Versão 2.0')
          ]};
          const base={subjects:[ti]};
          const units=methodUnits(ti);
          if(units.length!==4||!/^FD01\b/.test(units[0].title)) throw new Error('A trilha de teste deve preservar todos os itens e iniciar operacionalmente por FD01.');
          if(methodOrder(ti,units[0])!==1) throw new Error('FD01 deve aparecer como ordem estratégica 01.');
          if(!units.some(u=>/^FD00\b/.test(u.title))) throw new Error('FD00 deve permanecer preservado na trilha.');
          const fd01=units[0];
          const next=setUnit(base,'ti',fd01.id,{theoryDone:true,theoryDate:'2026-09-18',batteryDone:false,generalDone:false,materialReady:false});
          if(!next.subjects.find(s=>s.id==='ti').units.find(u=>u.id===fd01.id).theoryDone) throw new Error('FD01 deve poder ser concluído sem FD00.');
          console.log('Trilha TI OK:',units[0].title,'· conteúdo adicional preservado.');
          NODE
      - name: Validar liberação automática de checkpoint
        run: |
          cp metodo-et/src/core.js /tmp/core.mjs
          node --input-type=module - <<'NODE'
          import {normalizeMethodState,checkpoints,session,day} from '/tmp/core.mjs';
          const u=(id,order,title,attempted,correct)=>({id,order,title,theoryDone:true,theoryDate:'2026-09-20',batteryDone:false,generalDone:false,materialReady:false,battery:{attempted,correct},general:{attempted:0,correct:0},legacy:[],marks:[]});
          const afo={id:'afo',course:'AFO',phase:'new',slotMinutes:120,units:[u('afo-u-1',1,'M1',37,34),u('afo-u-2',2,'M2',65,52),u('afo-u-3',3,'M3',59,56)],checkpoints:{},notebooks:[],andresanComplete:false};
          const base={version:1,settings:{weeklyMinimum:1800,dailyMinimum:300,focus:'TCU',secondary:'CGU'},subjects:[afo],sessions:[],cycle:{index:0,minutes:0},imports:[],archive:[]};
          const normalized=normalizeMethodState(base);
          if(!normalized.subjects[0].units.every(x=>x.batteryDone)) throw new Error('Baterias com 30+ questões deveriam ser concluídas automaticamente.');
          if(checkpoints(normalized.subjects[0])[0].status!=='due') throw new Error('Checkpoint 1 de AFO deveria estar liberado.');
          const partial=u('afo-u-4',4,'M4',20,18);partial.theoryDate='2026-09-20';
          const s2={...afo,units:[partial],checkpoints:{}};
          const base2={...base,subjects:[s2],cycle:{index:0,minutes:0}};
          const after=session(base2,{subjectId:'afo',unitId:'afo-u-4',date:day(),activity:'battery',minutes:30,questions:10,correct:9,applyCycle:false});
          if(!after.subjects[0].units[0].batteryDone) throw new Error('Bateria deve concluir ao atingir 30 questões acumuladas.');
          console.log('Checkpoint automático OK.');
          NODE
      - name: Validar tempo integrado ao checkpoint
        run: |
          cp metodo-et/src/core.js /tmp/core.mjs
          node --input-type=module - <<'NODE'
          import {finishCheckpoint,setCheckpointTime,checkpoints,day} from '/tmp/core.mjs';
          const u=(id,order,title)=>({id,order,title,theoryDone:true,theoryDate:'2026-09-20',batteryDone:true,generalDone:false,materialReady:false,battery:{attempted:30,correct:27},general:{attempted:0,correct:0},legacy:[],marks:[]});
          const afo={id:'afo',course:'AFO',phase:'new',slotMinutes:120,units:[u('afo-u-1',1,'M1'),u('afo-u-2',2,'M2'),u('afo-u-3',3,'M3')],checkpoints:{},notebooks:[],andresanComplete:false};
          const base={version:1,settings:{weeklyMinimum:1800,dailyMinimum:300,focus:'TCU',secondary:'CGU'},subjects:[afo],sessions:[],cycle:{index:0,minutes:0},imports:[],archive:[]};
          const results={'afo-u-1':{attempted:5,correct:4},'afo-u-2':{attempted:6,correct:5},'afo-u-3':{attempted:4,correct:4}};
          const done=finishCheckpoint(base,'afo','afo-cp-1',results,60,true);
          const cp=checkpoints(done.subjects[0])[0];
          if(!cp.record?.done||cp.record.minutes!==60) throw new Error('Checkpoint deve armazenar 60 minutos.');
          const sessions=done.sessions.filter(s=>s.activity==='checkpoint');
          if(sessions.length!==1||sessions[0].minutes!==60||sessions[0].questions!==15||sessions[0].correct!==13) throw new Error('Checkpoint deve gerar um único registro no Diário com tempo e desempenho.');
          if(!sessions[0].cycleApplied||done.cycle.index!==1) throw new Error('Checkpoint atual deve poder concluir a ocorrência do ciclo.');
          const adjusted=setCheckpointTime(done,'afo','afo-cp-1',75);
          const adjustedSessions=adjusted.sessions.filter(s=>s.activity==='checkpoint');
          if(adjustedSessions.length!==1||adjustedSessions[0].minutes!==75) throw new Error('Ajustar tempo não pode duplicar o registro do checkpoint.');
          console.log('Tempo de checkpoint OK:',adjustedSessions[0].minutes,'min.');
          NODE
      - name: Validar auditoria da Meta 01
        run: |
          cp metodo-et/src/core.js /tmp/core.mjs
          node --input-type=module - <<'NODE'
          import {normalizeMethodState} from '/tmp/core.mjs';
          const canonical={id:'cp-auto',subjectId:'afo',unitId:'afo-u-1',title:'Checkpoint 1 · AFO',date:'2026-09-22',createdAt:'2026-09-22T19:01:20.226Z',activity:'checkpoint',minutes:60,questions:30,correct:17,legacy:false,cycleApplied:false,checkpointId:'afo-cp-1'};
          const duplicate={id:'cp-manual',subjectId:'afo',unitId:'afo-u-1',title:'Visão Geral.',date:'2026-09-22',createdAt:'2026-09-22T19:02:09.109Z',activity:'checkpoint',minutes:120,questions:0,correct:0,legacy:false,cycleApplied:true,slotComplete:true,notes:'Checkpoint das Aulas 1, 2 e 3;'};
          const unit=(id,order)=>({id,title:id,order,theoryDone:true,theoryDate:'2026-09-15',batteryDone:true,generalDone:false,materialReady:false,battery:{attempted:30,correct:25},general:{attempted:0,correct:0},legacy:[],marks:[]});
          const st={subjects:[{id:'afo',slotMinutes:120,units:[unit('afo-u-1',1),unit('afo-u-2',2),unit('afo-u-3',3)],checkpoints:{'afo-cp-1':{done:true,date:'2026-09-22',minutes:60,sessionId:'cp-auto',perUnit:{'afo-u-1':{attempted:5,correct:4},'afo-u-2':{attempted:5,correct:3},'afo-u-3':{attempted:5,correct:4}}}},notebooks:[],andresanComplete:false}],sessions:[canonical,duplicate]};
          const clean=normalizeMethodState(st);
          if(clean.sessions.length!==1||clean.sessions[0].id!=='cp-auto'||clean.sessions[0].minutes!==60) throw new Error('Duplicidade histórica do checkpoint não foi removida.');
          if(!clean.sessions[0].cycleApplied) throw new Error('Conclusão do ciclo deve ser preservada no registro canônico.');
          console.log('Auditoria Meta 01 OK.');
          NODE
      - name: Smoke checks v4.1.5
        run: |
          grep -q '4.1.5-meta01-audit' metodo-et/index.html
          grep -q 'app.js?v=4.1.5' metodo-et/index.html
          grep -q 'analytics.js?v=4.1.5' metodo-et/src/app.js
          grep -q 'personal.js?v=4.1.5' metodo-et/src/app.js
          grep -q 'goalSnapshot, completeGoal' metodo-et/src/app.js
          grep -q 'Central de Desempenho' metodo-et/src/app.js
          grep -q 'Metas ET' metodo-et/src/app.js
          grep -q 'Concluir esta ocorrência e chamar a próxima disciplina do ciclo' metodo-et/src/app.js
          grep -q 'PROGRESSO MULTICAMADA' metodo-et/src/app.js
          grep -q 'GOAL_TEMPLATES' metodo-et/src/personal.js
          grep -q 'TI_TCU_TRACK' metodo-et/src/core.js
          grep -q 'TI_TCU_SELECTED_36' metodo-et/src/core.js
          grep -q 'normalizeMethodState' metodo-et/src/core.js
          grep -q 'sessionCount' metodo-et/src/personal.js
          grep -q 'blockAtLeast' metodo-et/src/personal.js
          grep -q 'transborda para a próxima' metodo-et/src/app.js
          grep -q 'setCheckpointTime' metodo-et/src/core.js
          grep -q 'Concluir checkpoint + registrar tempo' metodo-et/src/app.js
          grep -q 'Salvar/ajustar tempo' metodo-et/src/app.js
          grep -q "battery.attempted>=30" metodo-et/src/core.js
          grep -q 'FD00' metodo-et/TI-TCU-TRILHA.md
          grep -q 'TI43' metodo-et/TI-TCU-TRILHA.md
          grep -q 'P1.1 FD01' metodo-et/src/personal.js
          grep -q 'TI25' metodo-et/TI-TCU-TRILHA.md
          grep -q "id:'meta-01'" metodo-et/src/personal.js
          grep -q "id:'meta-02'" metodo-et/src/personal.js
          ! grep -q 'CGU como possibilidade secundária' metodo-et/src/app.js
          ! grep -q 'A microrrevisão deve ocupar até 10% do bloco' metodo-et/src/core.js
          grep -q 'FOCO NO PROCESSO!' metodo-et/src/app.js
          grep -q 'A intensidade' metodo-et/src/app.js
          grep -q 'distorce a realidade' metodo-et/src/app.js
          ! grep -q 'Histórico StudyOS importado:' metodo-et/src/app.js
          grep -q 'Hoje x ontem' metodo-et/src/app.js
          grep -q 'Desempenho por disciplina' metodo-et/src/app.js
          grep -q 'Horas por semana' metodo-et/src/app.js
          grep -q 'Pontos de atenção' metodo-et/src/app.js
          grep -q 'data-progress-view' metodo-et/src/app.js
          grep -q 'progress-subject' metodo-et/src/app.js
          grep -q 'todas as disciplinas têm o mesmo valor' metodo-et/src/app.js
          grep -q 'analyticsSnapshot' metodo-et/src/analytics.js
          grep -q 'attentionItems' metodo-et/src/analytics.js
          grep -q 'login_hint' metodo-et/drive-sync.js
          grep -q 'refreshAccountInfo' metodo-et/drive-sync.js
          grep -q 'data-ach-filter' metodo-et/src/app.js
          grep -q 'todayCommandCenter' metodo-et/src/app.js
          grep -q 'quick-battery' metodo-et/src/app.js
          grep -q 'quick-checkpoint' metodo-et/src/app.js
          grep -q 'et-normal-icon' metodo-et/src/app.js
          ! grep -q 'MutationObserver' metodo-et/drive-sync.js
          ! grep -q 'main.focus()' metodo-et/src/app.js
